<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SA / BCD 用户画像专题</title>
  <style>
    :root{--ink:#203047;--muted:#748196;--line:#e2e8f0;--bg:#f5f7fb;--panel:#fff;--sa:#ef7c4d;--sa-soft:#fff1e9;--bcd:#4779ad;--bcd-soft:#eaf2fa;--navy:#193650;--teal:#23998e;--shadow:0 12px 34px rgba(38,53,78,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f3f6fb,#f8fafc 520px);color:var(--ink);font:14px/1.6 Inter,"Segoe UI","Microsoft YaHei",sans-serif}.shell{max-width:1540px;margin:auto;padding:24px}.hero{position:relative;overflow:hidden;padding:30px;border-radius:22px;background:linear-gradient(135deg,#17344e,#284d6f 64%,#287b7a);color:#fff;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:300px;height:300px;border:1px solid #ffffff2b;border-radius:50%;right:-110px;top:-180px;box-shadow:0 0 0 55px #ffffff08}.hero-row{position:relative;z-index:1;display:flex;justify-content:space-between;gap:24px;align-items:flex-end}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:#99d8d3}.hero h1{margin:5px 0 7px;font-size:31px;line-height:1.25}.hero p{margin:0;color:#d8e5ef}.scope{padding:10px 14px;border:1px solid #ffffff30;border-radius:13px;background:#ffffff0f;text-align:right;white-space:nowrap}.scope b{display:block;font-size:17px}.scope span{font-size:12px;color:#c7d6e2}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.kpi,.panel{border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:var(--shadow)}.kpi{padding:17px 18px}.kpi span{color:var(--muted);font-size:12px}.kpi b{display:block;margin-top:4px;font-size:25px}.kpi.sa{border-top:4px solid var(--sa)}.kpi.bcd{border-top:4px solid var(--bcd)}.kpi.teal{border-top:4px solid var(--teal)}.panel{padding:20px;margin-top:16px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:15px}.panel-head h2{margin:0;font-size:20px}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.legend{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:3px}.legend .sa{background:var(--sa)}.legend .bcd{background:var(--bcd)}.table-wrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0}th,td{padding:11px 13px;border-bottom:1px solid #edf1f5;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}thead th{background:#f6f8fb;color:#657286;font-size:12px}tbody tr:hover{background:#fafcff}td.sa{background:var(--sa-soft);color:#b85630;font-weight:800}td.bcd{background:var(--bcd-soft);color:#315f91;font-weight:800}.bar-cell{min-width:190px}.track{height:8px;border-radius:8px;background:#edf1f6;overflow:hidden}.track i{display:block;height:100%;border-radius:8px}.track i.sa{background:var(--sa)}.track i.bcd{background:var(--bcd)}.loading{padding:70px;text-align:center;color:var(--muted)}.error{color:#b33b4b}
    .filters{display:flex;align-items:end;gap:12px;margin:14px 0;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow)}.filter-field{display:grid;gap:5px;min-width:210px}.filter-field label{color:#647286;font-size:12px;font-weight:800}.filter-field select{width:100%;height:39px;padding:0 36px 0 11px;border:1px solid #d7dee8;border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.filter-note{margin-left:auto;color:var(--muted);font-size:12px}.quick-nav{position:sticky;top:0;z-index:20;display:flex;gap:7px;overflow:auto;margin:13px 0;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:#ffffffed;backdrop-filter:blur(12px);box-shadow:0 7px 22px rgba(38,53,78,.05)}.quick-nav a{flex:none;padding:6px 10px;border-radius:9px;color:#5b687a;text-decoration:none;font-size:12px;font-weight:750}.quick-nav a:hover{background:#edf3f8;color:var(--navy)}.insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.insight{padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff}.insight small{color:var(--muted)}.insight strong{display:block;margin:6px 0 2px;font-size:17px}.insight em{font-style:normal;color:var(--teal);font-weight:800}.section{scroll-margin-top:64px}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.section-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.compare-list{display:grid;gap:12px}.compare-row{display:grid;grid-template-columns:minmax(118px,1fr) minmax(150px,2fr) 58px 58px;gap:9px;align-items:center}.compare-row .label{overflow:hidden;color:#536174;text-overflow:ellipsis;white-space:nowrap}.dual-track{display:grid;gap:4px}.mini-track{height:7px;overflow:hidden;border-radius:8px;background:#edf1f6}.mini-track i{display:block;height:100%;border-radius:8px}.mini-track i.sa{background:var(--sa)}.mini-track i.bcd{background:var(--bcd)}.compare-row b{font-size:12px;text-align:right}.compare-row b.sa{color:#c45f37}.compare-row b.bcd{color:#356896}.sub-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}.sub-kpi{padding:14px;border-radius:13px;background:#f7f9fc}.sub-kpi span{display:block;color:var(--muted);font-size:11px}.sub-kpi b{display:block;margin-top:4px;font-size:18px}.sub-kpi.sa b{color:#c45f37}.sub-kpi.bcd b{color:#356896}.rank-list{display:grid;gap:7px}.rank-row{display:grid;grid-template-columns:25px minmax(0,1fr) 65px 54px;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;background:#f8fafc}.rank-row .rank{display:grid;width:23px;height:23px;place-items:center;border-radius:7px;background:#e8edf3;color:#657286;font-size:11px;font-weight:850}.rank-row:nth-child(-n+3) .rank{background:#ffe9dc;color:#b75933}.rank-row b,.rank-row small{text-align:right}.rank-row small{color:var(--muted)}.method{margin:18px 0 4px;padding:16px 18px;border:1px solid #eadfbe;border-radius:14px;background:#fffaf0;color:#735b28;font-size:12px}.method b{display:block;margin-bottom:4px}.empty{color:#9aa5b1}.section-number{display:inline-grid;width:28px;height:28px;margin-right:8px;place-items:center;border-radius:9px;background:#eaf2f8;color:#315f91;font-size:13px}.panel-head h2{display:flex;align-items:center}.metric-pill{padding:3px 8px;border-radius:12px;background:#eef7f5;color:#287e75;font-size:11px;font-weight:800}
    .overall-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:18px 0 2px}.overall-head h2{margin:0;font-size:23px}.overall-head p{margin:3px 0 0;color:var(--muted)}.overall-total{padding:9px 13px;border-radius:12px;background:#eaf7f5;color:#237d74;font-weight:800;white-space:nowrap}.single-list{display:grid;gap:10px;max-height:390px;overflow:auto;padding-right:4px}.single-row{display:grid;grid-template-columns:minmax(105px,1fr) minmax(130px,2fr) 62px 65px;gap:9px;align-items:center}.single-row .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.single-track{height:8px;border-radius:8px;background:#edf1f6;overflow:hidden}.single-track i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--teal),#4d8fb4)}.single-row b,.single-row small{text-align:right}.single-row small{color:var(--muted)}.compare-controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.compare-controls .filter-field{min-width:180px}.delta-up{color:#c55340;font-weight:800}.delta-down{color:#237d74;font-weight:800}.change-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.change-card{padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#fff}.change-card small{display:block;color:var(--muted)}.change-card strong{display:block;margin:5px 0;font-size:16px}.change-card span{color:#5f6d80}.signal{display:inline-block;margin-left:5px;padding:1px 7px;border-radius:10px;background:#eef3f7;color:#53657a;font-size:11px}.signal.obvious{background:#fff0e8;color:#b95532}.signal.moderate{background:#fff7e5;color:#9a6a10}.dimension-table{max-height:430px;overflow:auto}.dimension-table td:first-child{max-width:220px;overflow:hidden;text-overflow:ellipsis}.comparison-note{margin:0;color:var(--muted);font-size:12px}
    @media(max-width:1080px){.section-grid.three{grid-template-columns:1fr 1fr}.insights,.change-summary{grid-template-columns:1fr}.compare-row{grid-template-columns:minmax(105px,1fr) minmax(120px,1.6fr) 54px 54px}}
    @media(max-width:900px){.shell{padding:12px}.hero-row{display:block}.scope{margin-top:18px;text-align:left}.filters{align-items:stretch;flex-direction:column}.filter-field{min-width:0}.filter-note{margin-left:0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.section-grid,.section-grid.three{grid-template-columns:1fr}}
    @media(max-width:560px){.kpis{grid-template-columns:1fr}.hero h1{font-size:25px}.panel{padding:15px}.compare-row{grid-template-columns:100px minmax(100px,1fr) 48px 48px}.quick-nav{border-radius:11px}}
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="loading">正在加载 SA / BCD 用户画像数据…</div></main>
  <script>
    const pct=value=>`${(Number(value||0)*100).toFixed(1)}%`,pp=value=>`${(Number(value||0)*100).toFixed(1)}个百分点`,num=value=>Number(value||0).toLocaleString('zh-CN');
    const metricLabels=[['leads','人数','n'],['share','等级占比','p'],['femaleRate','女性占比','p'],['over51Rate','51岁以上','p'],['highCityRate','高线占比','p'],['friendRate','好友率','p'],['openRate','首次开口率','p'],['icebreakRate','AI破冰率','p'],['demandCoverage','诉求覆盖','p']];
    function tableRow(label,sa,bcd,type){const format=type==='n'?num:pct;return `<tr><td>${label}</td><td class="sa">${format(sa)}</td><td class="bcd">${format(bcd)}</td><td class="bar-cell"><div class="track"><i class="sa" style="width:${type==='n'?sa/(sa+bcd)*100:sa*100}%"></i></div></td><td class="bar-cell"><div class="track"><i class="bcd" style="width:${type==='n'?bcd/(sa+bcd)*100:bcd*100}%"></i></div></td></tr>`}
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function paired(a,b){const am=new Map(a.map(item=>[item.label,item])),bm=new Map(b.map(item=>[item.label,item]));return [...new Set([...a.map(item=>item.label),...b.map(item=>item.label)])].map(label=>({label,sa:am.get(label)||{count:0,rate:0},bcd:bm.get(label)||{count:0,rate:0}}))}
    function comparePanel(title,description,a,b,badge='占比'){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2><p>${description}</p></div><span class="metric-pill">${badge}</span></div><div class="compare-list">${paired(a,b).map(item=>`<div class="compare-row"><span class="label" title="${escapeHtml(item.label)}">${escapeHtml(item.label)}</span><div class="dual-track"><div class="mini-track"><i class="sa" style="width:${Math.min(item.sa.rate*100,100)}%"></i></div><div class="mini-track"><i class="bcd" style="width:${Math.min(item.bcd.rate*100,100)}%"></i></div></div><b class="sa">${pct(item.sa.rate)}</b><b class="bcd">${pct(item.bcd.rate)}</b></div>`).join('')}</div></section>`}
    function painPanel(title,items,grade){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2><p>同一用户可命中多个痛点，渗透率以等级线索数为分母</p></div><span class="metric-pill">${grade}</span></div><div class="rank-list">${items.map((item,index)=>`<div class="rank-row"><span class="rank">${index+1}</span><span>${escapeHtml(item.label)}</span><b>${num(item.count)}人</b><small>${pct(item.rate)}</small></div>`).join('')}</div></section>`}
    function viewFor(root,period){if(period!=='all'&&root.periodData?.[period])return {...root,...root.periodData[period],definitions:root.definitions};return root}
    function singlePanel(title,description,items){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2><p>${description}</p></div><span class="metric-pill">全量</span></div><div class="single-list">${items.map(item=>`<div class="single-row"><span class="label" title="${escapeHtml(item.label)}">${escapeHtml(item.label)}</span><div class="single-track"><i style="width:${Math.min(item.rate*100,100)}%"></i></div><b>${pct(item.rate)}</b><small>${num(item.count)}人</small></div>`).join('')}</div></section>`}
    function strength(delta){const value=Math.abs(delta);return value>=.05?['明显差异','obvious']:value>=.02?['中等差异','moderate']:['基本稳定','']}
    function strongest(a,b){const rows=paired(a||[],b||[]).map(item=>({...item,delta:item.bcd.rate-item.sa.rate})).sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta));return rows[0]||{label:'暂无数据',delta:0,sa:{rate:0},bcd:{rate:0}}}
    function changeCard(title,a,b,periodA,periodB){const item=strongest(a,b),[label,level]=strength(item.delta),direction=item.delta>0?'上升':item.delta<0?'下降':'不变';return `<article class="change-card"><small>${title}<span class="signal ${level}">${label}</span></small><strong>${escapeHtml(item.label)} ${direction} ${pp(Math.abs(item.delta))}</strong><span>${escapeHtml(periodA)} ${pct(item.sa.rate)} → ${escapeHtml(periodB)} ${pct(item.bcd.rate)}</span></article>`}
    function dimensionComparePanel(title,description,a,b,periodA,periodB){const rows=paired(a||[],b||[]);return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2><p>${description}</p></div><span class="metric-pill">百分点变化</span></div><div class="dimension-table"><table><thead><tr><th>维度</th><th>${escapeHtml(periodA)}</th><th>${escapeHtml(periodB)}</th><th>变化</th><th>判断</th></tr></thead><tbody>${rows.map(item=>{const delta=item.bcd.rate-item.sa.rate,[label,level]=strength(delta);return `<tr><td title="${escapeHtml(item.label)}">${escapeHtml(item.label)}</td><td>${pct(item.sa.rate)} · ${num(item.sa.count)}人</td><td>${pct(item.bcd.rate)} · ${num(item.bcd.count)}人</td><td class="${delta>0?'delta-up':delta<0?'delta-down':''}">${delta>0?'+':''}${pp(delta)}</td><td><span class="signal ${level}">${label}</span></td></tr>`}).join('')}</tbody></table></div></section>`}
    function periodComparison(root,periodA,periodB){const a=root.overall.byPeriod[periodA]||{},b=root.overall.byPeriod[periodB]||{},flowA=root.overall.infoFlowCampByPeriod[periodA]||{totalLeads:0,campAmounts:[]},flowB=root.overall.infoFlowCampByPeriod[periodB]||{totalLeads:0,campAmounts:[]};return `<div class="change-summary">${changeCard('一级渠道',a.firstChannels,b.firstChannels,periodA,periodB)}${changeCard('二级渠道',a.secondChannels,b.secondChannels,periodA,periodB)}${changeCard('三级渠道',a.thirdChannels,b.thirdChannels,periodA,periodB)}${changeCard('进量时间',a.intakeTimes,b.intakeTimes,periodA,periodB)}${changeCard('体验营金额',a.campAmounts,b.campAmounts,periodA,periodB)}${changeCard('信息流下体验营金额',flowA.campAmounts,flowB.campAmounts,periodA,periodB)}</div><p class="comparison-note">判断口径：占比变化绝对值 ≥5 个百分点为明显差异，2–5 个百分点为中等差异，低于 2 个百分点为基本稳定。</p><div class="section-grid">${dimensionComparePanel('一级渠道占比','不区分 SA/BCD',a.firstChannels,b.firstChannels,periodA,periodB)}${dimensionComparePanel('二级渠道占比','不区分 SA/BCD',a.secondChannels,b.secondChannels,periodA,periodB)}${dimensionComparePanel('三级渠道占比','不区分 SA/BCD',a.thirdChannels,b.thirdChannels,periodA,periodB)}${dimensionComparePanel('进量时间占比','不区分 SA/BCD',a.intakeTimes,b.intakeTimes,periodA,periodB)}${dimensionComparePanel('体验营金额占比','不区分 SA/BCD',a.campAmounts,b.campAmounts,periodA,periodB)}${dimensionComparePanel('信息流下体验营金额占比',`二级渠道＝信息流；${escapeHtml(periodA)} ${num(flowA.totalLeads)}人，${escapeHtml(periodB)} ${num(flowB.totalLeads)}人`,flowA.campAmounts,flowB.campAmounts,periodA,periodB)}</div>`}
    function render(root,period='all'){const periods=Object.keys(root.periodData||{});if(period!=='all'&&!periods.includes(period))period='all';const data=viewFor(root,period),sa=data.grades.SA,bcd=data.grades.BCD,pSa=sa.process,pBcd=bcd.process,periodOptions=`<option value="all">全部期数</option>${periods.map(item=>`<option value="${escapeHtml(item)}" ${item===period?'selected':''}>${escapeHtml(item)}</option>`).join('')}`,compareA=periods.length>1?periods[periods.length-2]:periods[0],compareB=periods.at(-1),compareOptions=selected=>periods.map(item=>`<option value="${escapeHtml(item)}" ${item===selected?'selected':''}>${escapeHtml(item)}</option>`).join('');document.getElementById('app').innerHTML=`
      <section class="hero"><div class="hero-row"><div><div class="eyebrow">TAI CHI · USER PROFILE</div><h1>SA / BCD 用户画像专题分析</h1><p>围绕人群结构、行为时段、学习诉求、产品与消费状态进行对照分析</p></div><div class="scope"><b>${data.scope.periods.join('、')}</b><span>${data.scope.startDate} — ${data.scope.endDate}</span></div></div></section>
      <nav class="quick-nav" aria-label="画像专题章节"><a href="#overall">渠道总览</a><a href="#process">过程数据</a><a href="#demographic">基础画像</a><a href="#intake">进量日期/时段</a><a href="#behavior">回复/学习时段</a><a href="#product">产品与消费</a><a href="#pain">需求痛点</a><a href="#demand">学习诉求</a></nav>
      <section class="section" id="overall"><div class="overall-head"><div><h2>全量渠道与进量画像对比</h2><p>不区分 SA/BCD，可任选两个期数查看渠道、进量时间和体验营金额差异</p></div><div class="overall-total">最新数据 · ${num(root.overall.totalLeads)} 条线索</div></div><section class="panel"><div class="panel-head"><div><h2>选择对比期数</h2><p>下方六组分析同步切换</p></div><div class="compare-controls"><div class="filter-field"><label for="comparePeriodA">期数 A</label><select id="comparePeriodA">${compareOptions(compareA)}</select></div><div class="filter-field"><label for="comparePeriodB">期数 B</label><select id="comparePeriodB">${compareOptions(compareB)}</select></div></div></div><div id="periodComparison">${periodComparison(root,compareA,compareB)}</div></section></section>
      <section class="filters" aria-label="SA/BCD画像筛选"><div class="filter-field"><label for="periodFilter">SA/BCD 画像期数</label><select id="periodFilter" ${periods.length?'':'disabled'}>${periodOptions}</select></div><div class="filter-note">当前口径：${period==='all'?'全部期数':escapeHtml(period)} · ${num(data.scope.totalLeads)} 条线索</div></section>
      <section class="kpis"><div class="kpi teal"><span>总用户线索数</span><b>${num(data.scope.totalLeads)}</b></div><div class="kpi sa"><span>SA 人数 / 占比</span><b>${num(sa.process.leads)} · ${pct(sa.process.share)}</b></div><div class="kpi bcd"><span>BCD 人数 / 占比</span><b>${num(bcd.process.leads)} · ${pct(bcd.process.share)}</b></div><div class="kpi"><span>数据更新时间</span><b style="font-size:17px">${new Date(data.generatedAt).toLocaleString('zh-CN',{hour12:false})}</b></div></section>
      <section class="insights"><article class="insight"><small>人群结构</small><strong>BCD 是主要人群，占 <em>${pct(pBcd.share)}</em></strong><span>SA 共 ${num(pSa.leads)} 人，BCD 共 ${num(pBcd.leads)} 人。</span></article><article class="insight"><small>典型画像差异</small><strong>SA 更偏女性与 51 岁以上</strong><span>女性高 ${pct(pSa.femaleRate-pBcd.femaleRate)}，51岁以上高 ${pct(pSa.over51Rate-pBcd.over51Rate)}。</span></article><article class="insight"><small>沟通基础</small><strong>SA 的好友、开口、破冰表现更高</strong><span>好友率 ${pct(pSa.friendRate)}，开口率 ${pct(pSa.openRate)}，AI破冰率 ${pct(pSa.icebreakRate)}。</span></article></section>
      <section class="panel section" id="process"><div class="panel-head"><div><h2><span class="section-number">1</span>SA / BCD 过程数据</h2><p>人数按线索数求和；率指标均以对应等级线索数为分母</p></div><div class="legend"><span><i class="sa"></i>SA</span><span><i class="bcd"></i>BCD</span></div></div><div class="table-wrap"><table><thead><tr><th>指标</th><th>SA</th><th>BCD</th><th>SA 视觉占比</th><th>BCD 视觉占比</th></tr></thead><tbody>${metricLabels.map(([key,label,type])=>tableRow(label,pSa[key],pBcd[key],type)).join('')}</tbody></table></div></section>
      <section class="section" id="demographic"><div class="section-grid three">${comparePanel('<span class="section-number">2</span>性别分布','女性、男性与未知结构',sa.demographics.gender,bcd.demographics.gender)}${comparePanel('年龄分布','≤50岁、51-60岁、61岁+ 分层',sa.demographics.age,bcd.demographics.age)}${comparePanel('城市分层','高线：一线/超一线；中线：二线/三线；低线：四线/五线及其他',sa.demographics.city,bcd.demographics.city)}</div></section>
      <section class="section" id="intake"><div class="section-grid">${comparePanel('<span class="section-number">3</span>进量日期','展示每日进入线索在各等级中的占比',sa.intake.dates,bcd.intake.dates)}${comparePanel('进量时段','按源字段“进量时间”展示',sa.intake.times,bcd.intake.times)}</div></section>
      <section class="section" id="behavior"><div class="section-grid">${comparePanel('<span class="section-number">4</span>活跃 / 学习时段','以源字段“常活跃时间段”作为学习活跃时段',sa.behavior.activeTimes,bcd.behavior.activeTimes)}${comparePanel('常回复时段','展示用户更常回复消息的时间段',sa.behavior.replyTimes,bcd.behavior.replyTimes)}</div></section>
      <section class="section" id="product"><div class="section-grid"><section class="panel"><div class="panel-head"><div><h2><span class="section-number">5</span>产品与消费状态</h2><p>常活跃产品端、体验营金额和消费状态统一展示</p></div></div><div class="sub-kpis"><div class="sub-kpi sa"><span>SA 首笔体验营 / 无正式营消费</span><b>${pct(sa.productConsumption.firstCampRate)} / ${pct(sa.productConsumption.noFormalRate)}</b></div><div class="sub-kpi bcd"><span>BCD 首笔体验营 / 无正式营消费</span><b>${pct(bcd.productConsumption.firstCampRate)} / ${pct(bcd.productConsumption.noFormalRate)}</b></div></div>${comparePanel('常活跃产品端','各端活跃占等级线索数比例',sa.productConsumption.products,bcd.productConsumption.products).replace('class="panel"','class=""')}</section>${comparePanel('体验营金额','体验营金额类型占等级线索数比例',sa.productConsumption.campAmounts,bcd.productConsumption.campAmounts)}</div></section>
      <section class="section" id="pain"><div class="section-grid">${painPanel('<span class="section-number">6</span>SA 需求痛点 Top 12',sa.painTop,'SA')}${painPanel('BCD 需求痛点 Top 12',bcd.painTop,'BCD')}</div></section>
      <section class="section" id="demand">${comparePanel('<span class="section-number">7</span>学习诉求','学习诉求文本按模板主题进行关键词归类；未填写单独展示',sa.demands,bcd.demands)}</section>
      <aside class="method"><b>指标口径与数据说明</b>好友率＝好友数/线索数；首次开口率＝开口数/线索数；AI破冰率＝破冰数/线索数；诉求覆盖＝学习诉求非空对应线索数/总线索数。高线城市包含一线、超一线，并将源数据“新一线”按同口径归入高线；页面仅展示最新聚合数据，不包含用户明细。</aside>`;document.getElementById('periodFilter')?.addEventListener('change',event=>render(root,event.target.value));const updateComparison=()=>{const a=document.getElementById('comparePeriodA').value,b=document.getElementById('comparePeriodB').value;document.getElementById('periodComparison').innerHTML=periodComparison(root,a,b)};document.getElementById('comparePeriodA')?.addEventListener('change',updateComparison);document.getElementById('comparePeriodB')?.addEventListener('change',updateComparison)}
    fetch('data/profile.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}).then(data=>render(data)).catch(error=>{document.getElementById('app').innerHTML=`<div class="loading error">画像数据加载失败：${error.message}</div>`});
  </script>
</body>
</html>
