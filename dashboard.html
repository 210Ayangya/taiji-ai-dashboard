ary-head{background:#7b3fc6}.status-summary.operation .status-summary-head{background:#3478d4}.status-summary.volume .status-summary-head{background:#32935a}.status-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(105px,1fr));gap:1px;background:#edf0f4}.summary-metric{min-height:88px;padding:10px 12px;background:#fff}.summary-metric span{display:block;color:#8792a1;font-size:11px}.summary-metric b{display:block;margin-top:3px;color:#26374d;font-size:18px}.summary-metric small{display:block;margin-top:4px;color:#8a95a3;font-size:11px}.summary-metric small em{font-style:normal;font-weight:750}.summary-metric small em.good{color:var(--green)}.summary-metric small em.bad{color:var(--red)}.summary-metric.focus b{color:#c33e4e}.status-summary-empty{padding:22px 14px;color:#8c97a5;text-align:center;background:#fafbfd}.delta.good{color:var(--green)}.delta.bad{color:var(--red)}

mportant}.good{color:var(--green)}.bad{color:var(--red)}.empty{color:#a2abb5}.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 13px}.tabs button{padding:7px 13px}.dimension-period-control,.history-period-control{display:flex;align-items:center;gap:10px;padding:10px 13px;border:2px solid #8b78d0;border-radius:13px;background:#f3efff;color:#59479c;font-size:15px;font-weight:800;box-shadow:0 4px 12px #7864bd18}.dimension-period-control:before,.history-period-control:before{content:"筛选";padding:3px 8px;border-radius:12px;background:#ded5fb;color:#5f4ba5;font-size:11px;letter-spacing:.08em}.dimension-period-control select,.history-period-control select{min-width:190px!important;margin-left:0!important;border-color:#a897df!important;background:#fff!important;font-size:14px!important;font-weight:800}.history-period-control{border-color:#d9a74f;background:#fff7e7;color:#8a5a0f}.history-period-control:before{background:#f5deb3;color:#8a5a0f}.history-period-control select{border-color:#dfb86f!important}.panel-title>span:first-child{display:flex;align-items:center;gap:8px}.panel-title>span:first-child:before{content:"";width:8px;height:8px;border-radius:3px;background:var(--primary);box-shadow:0 0 0 4px #5b7df214}.loading,.error{padding:70px;text-align:center}.error{color:var(--red)}.footer{padding:20px;text-align:center;color:#9aa4b1;font-size:12px}

</style></head><body><main class="shell">
<header class="hero"><div class="hero-row"><div><div class="eyebrow">TAI CHI AI · DAILY REPORT</div><h1>太极AI组日报在线表格</h1><p>运营行课、销转结果、销售个人与细分维度的一体化日报</p></div><div class="status"><span class="dot"></span><span id="heroStatus">正在读取最新数据</span></div></div></header>
<nav class="toolbar"><a href="#overview">今日概览</a><a href="#team">团队整体</a><a href="#personal">销售个人</a><a href="#dimension">细分维度</a><label>指标期数 <select id="period"></select></label><a class="refresh-control" href="http://127.0.0.1:18766/" target="_blank" rel="noopener" title="仅管理员本机可用">刷新数据</a><button class="export" id="export">导出 Excel</button></nav>
<div id="content"><div class="loading">正在加载聚合数据…</div></div><footer class="footer">数据源：太极数据源 Excel「查询1」｜仅展示聚合指标</footer>
</main><script>
const AI='AI先锋组8期',MARKET='大盘组',ALL_PERIODS='__all__',broadcastStatuses=new Set(['销转中','运营中']);let dimensionPeriodName='',currentDimensionKey='age';
function isBriefPeriod(p){const match=String(p.phase??'').match(/D\s*(-?\d+)/i);return Boolean(match)&&Number(match[1])<=7}
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F={p:v=>v==null?'—':(v*100).toFixed(1)+'%',n:(v,d=0)=>v==null?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:d}),m:v=>v==null?'—':'¥'+Number(v).toLocaleString('zh-CN',{maximumFractionDigits:0}),r:v=>v==null?'—':Number(v).toFixed(2)};
const d=(a,b,type='p')=>{if(a==null||b==null)return '—';const x=a-b,s=x>=0?'+':'';return type==='p'?s+(x*100).toFixed(1)+'%':type==='m'?s+F.m(x):type==='i'?s+F.n(x):s+F.n(x,2)};
const cls=(a,b,reverse=false)=>a==null||b==null?'':((a-b)*(reverse?-1:1)>0?'good':(a-b)*(reverse?-1:1)<0?'bad':'');
const cell=(v,c='')=>`<td class="${c}">${E(v)}</td>`;
function table(title,heads,rows,note='左右滑动查看全部指标',tone='',badge=''){const body=rows.length?rows.join(''):`<tr><td colspan="${heads.length}" class="status-summary-empty">当前暂无对应期数，后续刷新后将自动展示</td></tr>`;return `<article class="panel data-card ${tone}"><div class="card-head"><div class="card-title-wrap">${badge?`<span class="template-badge ${tone}">${E(badge)}</span>`:''}<strong>${E(title)}</strong></div><span class="period-tag"><i></i>${E(note)}</span></div><div class="scroll-hint">← 横向滚动可查看完整列 →</div><div class="table-scroll"><table><thead><tr>${heads.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></article>`}
const touchHeads=['期数','时间','部门','线索数','线索占比','进群率','好友率','开口率','好友开口率','有效会话率','人服比','破冰率'];
const classHeads=['期数','时间','部门','先导到课率','先导完课率',...['D1','D2','D3','D4','D5'].flatMap(x=>[x+'到课率',x+'完课率',x+'直播到课率',x+'直播有效到课率',x+'直播完课率'])];
const courseHeads=[...touchHeads,...classHeads.slice(3)];
const convHeads=['期数','时间','部门','总转化率','直播转率','社群转率','GMV','ROI','LTV','人效','人数','人服比','今日总转化率','今日直播转率','今日社群转率','今日ROI','单粉成本'];
const volumeHeads=['期数','时间','部门','线索数','线索成本','单粉成本','进群率','好友率','开口率','好友开口率','有效会话率','先导到课率','先导完课率'];
function touchVals(m,share){return [F.n(m.leads),F.p(share),F.p(m.groupRate),F.p(m.friendRate),F.p(m.openRate),F.p(m.friendOpenRate),F.p(m.validConversationRate),F.n(m.serviceRatio,1),F.p(m.icebreakRate)]}
function classVals(m){const out=[];m.attendance.filter(x=>x.day==='先导'||/^D[1-5]$/.test(x.day)).forEach((x,i)=>{out.push(F.p(x.attendanceRate),F.p(x.completionRate));if(i)out.push(F.p(x.liveAttendanceRate),F.p(x.liveEffectiveAttendanceRate),F.p(x.liveCompletionRate))});return out}
function courseVals(m,share){return [...touchVals(m,share),...classVals(m)]}
function convVals(m){return [F.p(m.conversionRate),F.p(m.liveConversionRate),F.p(m.communityConversionRate),F.m(m.gmv),F.r(m.roi),F.m(m.ltv),F.m(m.productivity),F.n(m.salesCount),F.n(m.serviceRatio,1),F.p(m.todayConversionRate),F.p(m.todayLiveConversionRate),F.p(m.todayCommunityConversionRate),F.r(m.todayRoi),F.m(m.singleFanCost)]}
const leadUnitCost=m=>m?.leads?m.cost/m.leads:null;
function volumeVals(m){return [F.n(m.leads),m.cost?F.m(m.cost):'—',leadUnitCost(m)?F.m(leadUnitCost(m)):'—',F.p(m.groupRate),F.p(m.friendRate),F.p(m.openRate),F.p(m.friendOpenRate),F.p(m.validConversationRate),F.p(m.attendance[0]?.attendanceRate),F.p(m.attendance[0]?.completionRate)]}
function normalRow(p,label,m,mode,share){const vals=mode==='touch'?touchVals(m,share):mode==='class'?classVals(m):mode==='course'?courseVals(m,share):mode==='volume'?volumeVals(m):convVals(m),summary=label===AI||label==='大盘'||label.includes('汇总'),rowClass=summary?(label.includes('AI先锋')||label===AI?'summary-ai':'summary-market'):'';return `<tr class="${rowClass}">${cell(p.name,'name')}${cell(p.phase)}${cell(label,'name')}${vals.map(v=>cell(v)).join('')}</tr>`}
function compareRow(p,a,b,mode,label='AI先锋组 - 大盘'){let specs;if(mode==='touch')specs=[null,null,['groupRate','p'],['friendRate','p'],['openRate','p'],['friendOpenRate','p'],['validConversationRate','p'],['serviceRatio','n'],['icebreakRate','p']];else if(mode==='class'){specs=[];a.attendance.filter(x=>x.day==='先导'||/^D[1-5]$/.test(x.day)).forEach((x,i)=>{specs.push([`attendance.${i}.attendanceRate`,'p'],[`attendance.${i}.completionRate`,'p']);if(i)specs.push([`attendance.${i}.liveAttendanceRate`,'p'],[`attendance.${i}.liveEffectiveAttendanceRate`,'p'],[`attendance.${i}.liveCompletionRate`,'p'])})}else if(mode==='course'){specs=[null,null,['groupRate','p'],['friendRate','p'],['openRate','p'],['friendOpenRate','p'],['validConversationRate','p'],['serviceRatio','n'],['icebreakRate','p']];a.attendance.filter(x=>x.day==='先导'||/^D[1-5]$/.test(x.day)).forEach((x,i)=>{specs.push([`attendance.${i}.attendanceRate`,'p'],[`attendance.${i}.completionRate`,'p']);if(i)specs.push([`attendance.${i}.liveAttendanceRate`,'p'],[`attendance.${i}.liveEffectiveAttendanceRate`,'p'],[`attendance.${i}.liveCompletionRate`,'p'])})}else if(mode==='volume')specs=[['leads','i'],['cost','m'],['unitCost','m'],['groupRate','p'],['friendRate','p'],['openRate','p'],['friendOpenRate','p'],['validConversationRate','p'],['attendance.0.attendanceRate','p'],['attendance.0.completionRate','p']];else specs=[['conversionRate','p'],['liveConversionRate','p'],['communityConversionRate','p'],['gmv','m'],['roi','n'],['ltv','m'],['productivity','m'],['salesCount','i'],['serviceRatio','n'],['todayConversionRate','p'],['todayLiveConversionRate','p'],['todayCommunityConversionRate','p'],['todayRoi','n'],['singleFanCost','m']];const get=(o,k)=>k==='unitCost'?leadUnitCost(o):k?.split('.').reduce((v,x)=>v?.[x],o);const vals=specs.map(s=>{if(!s)return{v:'—',c:''};const av=get(a,s[0]),bv=get(b,s[0]);return{v:d(av,bv,s[1]),c:cls(av,bv,s[0].includes('Cost'))}});return `<tr class="compare">${cell(p.name,'name')}${cell('对比')}${cell(label,'name')}${vals.map(x=>cell(x.v,x.c)).join('')}</tr>`}
function teamRows(periods,mode){const rows=[];for(const p of periods){const a=p.groups[AI]?.total,b=p.groups[MARKET]?.total,total=(a?.leads||0)+(b?.leads||0);if(a)rows.push(normalRow(p,AI,a,mode,a.leads/(total||1)));if(b)rows.push(normalRow(p,'大盘',b,mode,b.leads/(total||1)));if(a&&b)rows.push(compareRow(p,a,b,mode))}return rows}
function personalRows(periods,mode){const rows=[];for(const p of periods){const ai=p.groups[AI],market=p.groups[MARKET],total=(ai?.total.leads||0)+(market?.total.leads||0);if(ai){rows.push(normalRow(p,'AI先锋组汇总',ai.total,mode,ai.total.leads/(total||1)));for(const sale of ai.dimensions.sales||[])rows.push(normalRow(p,`↳ ${sale.label}`,sale,mode,sale.leads/(ai.total.leads||1)))}if(market)rows.push(normalRow(p,'大盘组汇总',market.total,mode,market.total.leads/(total||1)))}return rows}
function kpi(label,value,a,b,detail,type='p',reverse=false){const compare=a!=null&&b!=null?` <span class="delta ${cls(a,b,reverse)}">${E(d(a,b,type))}</span>`:'';return `<div class="kpi"><div class="label">${E(label)}</div><div class="value">${E(value)}</div><div class="sub">${E(detail)}${compare}</div></div>`}
const metricFormat=(v,type)=>type==='p'?F.p(v):type==='m'?F.m(v):type==='n'?F.r(v):F.n(v);
function broadcastLine(label,a,b,type='p',focus=false){return `<div class="broadcast-line${focus?' focus':''}"><span>【${E(label)}】</span><span>${E(metricFormat(a,type))}（大盘 ${E(metricFormat(b,type))}）</span><span class="variance ${cls(a,b)}">${E(d(a,b,type))}</span></div>`}
