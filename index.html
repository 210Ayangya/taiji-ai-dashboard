<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>太极 AI 数据分析目录</title>
  <style>
    :root{--ink:#22304a;--muted:#748193;--line:#e3e8f0;--primary:#5b7df2;--teal:#2ca69a;--violet:#7b6bc7;--bg:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7f9ff,#f3faf8);color:var(--ink);font:14px/1.6 Inter,"Segoe UI","Microsoft YaHei",sans-serif}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:48px 0}.hero{padding:34px 38px;border:1px solid var(--line);border-radius:24px;background:#ffffffd9;box-shadow:0 18px 55px #32425f12}.eyebrow{color:#6d7fd6;font-size:12px;font-weight:800;letter-spacing:.18em}.hero h1{margin:7px 0 8px;font-size:34px;line-height:1.25}.hero p{margin:0;color:var(--muted);font-size:16px}.section-title{margin:30px 4px 14px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{display:block;min-height:210px;padding:26px;border:1px solid var(--line);border-radius:20px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 10px 30px #32425f0c;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#bcc9ee;box-shadow:0 18px 42px #32425f18}.card.primary{background:linear-gradient(135deg,#fff,#f2f5ff)}.icon{display:grid;width:46px;height:46px;place-items:center;border-radius:14px;background:#e9efff;color:var(--primary);font-size:22px;font-weight:900}.card h2{margin:18px 0 6px;font-size:21px}.card p{margin:0;color:var(--muted)}.meta{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}.tag{padding:4px 10px;border-radius:16px;background:#edf7f5;color:#257c73;font-size:12px;font-weight:700}.coming{border-style:dashed;background:#fafbfc}.coming .icon{background:#f0edfb;color:var(--violet)}.coming .tag{background:#f1eefb;color:#6b5aaa}.footer{padding:28px 4px;color:#9aa4b1;text-align:center}@media(max-width:720px){.shell{padding:22px 0}.hero{padding:26px}.hero h1{font-size:27px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">TAI CHI AI · ANALYTICS HUB</div>
      <h1>太极 AI 数据分析目录</h1>
      <p>统一进入日报看板和后续专题分析，持续沉淀太极业务的数据洞察。</p>
    </header>
    <h2 class="section-title">日报与常用分析</h2>
    <section class="grid">
      <a class="card primary" href="dashboard.html">
        <span class="icon">日</span>
        <h2>日报在线看板</h2>
        <p>查看今日概览、团队整体、销售个人、细分维度及大盘对比。</p>
        <div class="meta"><span class="tag">每日更新</span><span class="tag">当前可用</span></div>
      </a>
      <article class="card coming">
        <span class="icon">专</span>
        <h2>专题分析</h2>
        <p>后续专题报告、阶段复盘和专项洞察将从这里统一进入。</p>
        <div class="meta"><span class="tag">持续建设</span></div>
      </article>
    </section>
    <footer class="footer">太极 AI 数据分析中心 · 仅展示聚合指标</footer>
  </main>
</body>
</html>
